version: "3.9"

services:
  db:
    image: postgres:16
    container_name: grind_db
    environment:
      POSTGRES_DB: grind_db
      POSTGRES_USER: grind_user
      POSTGRES_PASSWORD: grind_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grind_user -d grind_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grind_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DB_NAME: grind_db
      DB_USER: grind_user
      DB_PASSWORD: grind_pass
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grind_frontend
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true


volumes:
  postgres_data:
    external: true
    name: grind_postgres_data